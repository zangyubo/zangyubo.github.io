# .github/workflows/deploy-rspress.yml
name: Deploy rspress site to Pages

on:
  # 当推送到 rspress 分支时触发
  push:
    branches: ['rspress']

  # 允许从 Actions 选项卡手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署，跳过排队中的运行
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10.33.2' # 与本地开发环境一致

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.2'
          cache: 'pnpm' # 自动缓存 pnpm store，大幅加速安装

      - name: 安装依赖
        run: pnpm install --frozen-lockfile # 类似 npm ci，需存在 pnpm-lock.yaml

      - name: 构建 rspress 站点
        run: pnpm run build # 请确认 package.json 中的构建脚本名称

      - name: 上传构建产物（静态文件）
        uses: actions/upload-pages-artifact@v5
        with:
          path: './doc_build' # 你的 rspress 输出目录

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
